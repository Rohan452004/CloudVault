apiVersion : apps/v1
kind : Deployment
metadata : 
  name : mongodb-deployment
  namespace : cloudvault-app

spec :
  replicas : 1
  selector : 
    matchLabels : 
      app : mongodb

  template :       #pod template
    metadata : 
      labels : 
        app : mongodb
      name : mongodb-pod
      namespace : cloudvault-app
    spec : 
      containers :
      - name : mongodb-container 
        image : mongo:latest
        ports :
        - containerPort : 27017